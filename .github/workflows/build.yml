name: Build Android APK

# Builds the debug APK on every push to main, and on demand from the Actions tab.
# The APK is kept as a download on the run ("WeatherLabAndroid-debug").

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu image already has the Android SDK installed (ANDROID_HOME).
      - name: Install the platform and build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK folder: $SDK"
          ls "$SDK" || true
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then SM="$(find "$SDK" -name sdkmanager -path '*bin*' 2>/dev/null | head -1)"; fi
          echo "sdkmanager: $SM"
          if [ -z "$SM" ]; then echo "No sdkmanager found on this runner."; exit 1; fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherLabAndroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
