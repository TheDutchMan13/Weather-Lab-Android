name: Release APK

# Builds a signed release APK and attaches it to a GitHub release.
# To make one: push a tag that starts with v, for example v0.3.0 (the tag's name becomes the release's name).
#   git tag v0.3.0
#   git push origin v0.3.0
# It needs four secrets in the repository's Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# See the README ("Making a release") for how to create the key and add them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. See the README, Making a release."
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the platform and build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then SM="$(find "$SDK" -name sdkmanager -path '*bin*' 2>/dev/null | head -1)"; fi
          if [ -z "$SM" ]; then echo "No sdkmanager found on this runner."; exit 1; fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :wear:assembleRelease --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" WeatherLabAndroid-${GITHUB_REF_NAME}.apk
          WEAR="$(ls wear/build/outputs/apk/release/*.apk | head -1)"
          cp "$WEAR" WeatherLabWear-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" "WeatherLabAndroid-${GITHUB_REF_NAME}.apk" "WeatherLabWear-${GITHUB_REF_NAME}.apk" \
            --title "Weather Lab for Android $GITHUB_REF_NAME" --generate-notes
